<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#neon-cyan)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Radar Circles -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="65" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Phone Outline -->
  <rect x="176" y="96" width="160" height="320" rx="32" fill="#0b1329" stroke="url(#neon-cyan)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Notch & Speaker -->
  <line x1="236" y1="126" x2="276" y2="126" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Home Indicator / Fingerprint -->
  <circle cx="256" cy="382" r="12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Shield In Center -->
  <path d="M256 160 L310 190 V260 C310 295 285 325 256 335 C227 325 202 295 202 260 V190 Z" fill="rgba(16,185,129,0.15)" stroke="url(#shield-grad)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Radar Crosshairs -->
  <line x1="256" y1="195" x2="256" y2="300" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="216" y1="245" x2="296" y2="245" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  
  <!-- Central Pulse Dot -->
  <circle cx="256" cy="245" r="8" fill="#38bdf8" filter="url(#glow)"/>
</svg>
