<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#1e1306"/>
    </linearGradient>
    <linearGradient id="rz-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="rz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#rz-bg)"/>
  <rect x="3" y="3" width="94" height="94" rx="20" fill="none" stroke="url(#rz-accent)" stroke-width="2.5" opacity="0.6"/>
  <!-- Cyber Shield Emblem -->
  <polygon points="50,15 82,30 82,60 50,85 18,60 18,30" fill="#131927" stroke="url(#rz-accent)" stroke-width="3"/>
  <polygon points="50,22 75,34 75,56 50,77 25,56 25,34" fill="#0b0e17" opacity="0.85"/>
  <!-- Stylized Cyber R -->
  <path d="M38 32 h16 c8 0 13 4 13 11 0 5-3 9-8 10.5 l9 16.5 h-7.5 l-8.2-15 h-6.3 v15 h-8 V32 z M46 47 h7.5 c4 0 6.5-2 6.5-5.5 s-2.5-5.5-6.5-5.5 H46 v11 z" fill="url(#rz-accent)" filter="url(#rz-glow)"/>
  <!-- Top & Bottom Details -->
  <circle cx="50" cy="22" r="3" fill="#F59E0B"/>
  <text x="50" y="93" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" letter-spacing="1" fill="#F59E0B" text-anchor="middle">RUIZEN TEAM</text>
</svg>
