<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient: Ultra deep void -->
    <linearGradient id="rz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="100%" stop-color="#080711"/>
    </linearGradient>

    <!-- App Border Accent (Gold to Violet) -->
    <linearGradient id="rz-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Main Roof & Bar Flow Gradient (White -> Yellow -> Gold -> Magenta -> Purple) -->
    <linearGradient id="rz-roof-grad" x1="0.3" y1="0.15" x2="0.85" y2="0.65">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="10%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FFEA00"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Middle Crossbar Gradient (Yellow point at left to Violet at right) -->
    <linearGradient id="rz-cross-grad" x1="0.35" y1="0.5" x2="0.75" y2="0.6">
      <stop offset="0%" stop-color="#FFEA00"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Lower Right Violet Leg Gradient -->
    <linearGradient id="rz-right-leg" x1="0.45" y1="0.5" x2="0.65" y2="0.85">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="35%" stop-color="#9333EA"/>
      <stop offset="80%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Lower Left Golden Leg Gradient -->
    <linearGradient id="rz-left-leg" x1="0.4" y1="0.5" x2="0.35" y2="0.8">
      <stop offset="0%" stop-color="#FFEA00"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Top Left Shard Highlight -->
    <linearGradient id="rz-shard" x1="0.3" y1="0.15" x2="0.4" y2="0.45">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFFDE7"/>
      <stop offset="70%" stop-color="#FFEA00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Dynamic Neon Drop Shadow -->
    <filter id="rz-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- High-Tech Dark Container (Square with smooth rounded corners) -->
  <rect width="100" height="100" rx="22" fill="url(#rz-bg)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="20.5" fill="none" stroke="url(#rz-border)" stroke-width="2" opacity="0.4"/>
  <circle cx="50" cy="50" r="38" fill="rgba(139, 92, 246, 0.06)"/>

  <!-- Glowing Aura for Stylized R -->
  <g filter="url(#rz-neon-glow)" opacity="0.3">
    <path d="M 35 18 L 61 48 L 58 52 L 65 61 L 38 47 L 59 81 L 45 63 L 36 78 L 41 53 Z" fill="url(#rz-border)"/>
  </g>

  <!-- ============================================== -->
  <!-- Official Sharp Cyberpunk 'R' Emblem Facets     -->
  <!-- ============================================== -->

  <!-- 1. Upper Diagonal Roof & Outer Right Chevron -->
  <!-- Topmost peak (35,18) -> Down-right to (61,48) -> Arrow notch to (58,52) -> (65,61) -> Inner edge back to (42,33) -->
  <polygon points="35,18 61,48 58,52 65,61 57,51 42,33" fill="url(#rz-roof-grad)"/>

  <!-- 2. Central Folding Crossbar (Forms bottom of triangular hole) -->
  <!-- From right tip (65,61) cutting left to sharp beak at (38,47), top edge to (57,51), bottom edge to (45,55) -->
  <polygon points="38,47 57,51 65,61 52,58 45,55" fill="url(#rz-cross-grad)"/>

  <!-- 3. Lower Right Deep-Violet Sharp Wing / Leg -->
  <!-- Upper join at (45,55), outer edge to (59,81.5), inner edge cutting up to (47,63) -->
  <polygon points="45,55 52,58 59,81.5 47,63" fill="url(#rz-right-leg)"/>

  <!-- 4. Lower Left Golden / Amber Leg with Sharp Hook -->
  <!-- Upper anchor (39,48), outer left edge slants down to (36,78), with thorn spur to (35.2,67.5) -->
  <!-- Bottom chamfer up to (44.5,72), inner facet spur to (47,65), up to (41,53) -->
  <polygon points="39,48 41,53 47,65 44.5,72 36,78 35.2,67.5 37,73 38,53" fill="url(#rz-left-leg)"/>

  <!-- 5. Upper Left Stem & Shard with Bevel Highlight -->
  <!-- From top peak (35,18) down the left side with notch: (34.8,22.5) -> (35.8,23.5) -> (36.5,30) -> (39,47.5) -->
  <polygon points="35,18 34.8,22.5 35.8,23.5 36.8,30 39,47.5 41.5,47.5 38.5,30 42,33" fill="url(#rz-shard)"/>

  <!-- 6. Razor-sharp Pure White Metal Bevel on Top Peak -->
  <polygon points="35,18 42,33 39.5,31 35,18" fill="#FFFFFF" opacity="0.95"/>
  <polygon points="35,18 39,24 35.5,22.5" fill="#FFFFFF"/>
</svg>
