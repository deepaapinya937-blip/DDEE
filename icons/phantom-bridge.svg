<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0B1A"/>
      <stop offset="100%" stop-color="#140D26"/>
    </linearGradient>
    <linearGradient id="pb-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#pb-bg)"/>
  <rect x="3" y="3" width="94" height="94" rx="20" fill="none" stroke="url(#pb-neon)" stroke-width="2.5" opacity="0.6"/>
  <!-- Console window frame -->
  <rect x="18" y="22" width="64" height="52" rx="8" fill="#090D16" stroke="#A855F7" stroke-width="2"/>
  <!-- Console header bar -->
  <rect x="18" y="22" width="64" height="12" rx="8" fill="#1E1B4B"/>
  <circle cx="26" cy="28" r="2.5" fill="#EF4444"/>
  <circle cx="34" cy="28" r="2.5" fill="#F59E0B"/>
  <circle cx="42" cy="28" r="2.5" fill="#10B981"/>
  <!-- Prompt & Bridge icon -->
  <text x="25" y="52" font-family="'Consolas', 'Courier New', monospace" font-size="16" font-weight="900" fill="#38BDF8">&gt;_</text>
  <polygon points="50,42 66,54 50,66 54,54" fill="#EC4899"/>
  <!-- Key icon -->
  <circle cx="50" cy="54" r="5" fill="none" stroke="#FBBF24" stroke-width="2"/>
  <line x1="55" y1="54" x2="72" y2="54" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="54" x2="66" y2="59" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="71" y1="54" x2="71" y2="58" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <!-- Text Label -->
  <text x="50" y="88" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#E9D5FF" text-anchor="middle" letter-spacing="1">PHANTOM BRIDGE</text>
</svg>
